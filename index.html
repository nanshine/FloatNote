<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FloatNote</title>
    <style>
      body { margin: 0; }
      #startup-shell {
        --startup-bg: #fafaf9; --startup-ink: #424650;
        --startup-muted: #92959d; --startup-accent: #7778ad; --startup-tile: #efeff5;
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 32px; box-sizing: border-box; text-align: center;
        background: var(--color-bg, var(--startup-bg)); color: var(--color-text, var(--startup-ink));
        font: 13px/1.6 system-ui, sans-serif;
      }
      .startup-mark {
        display: grid; place-items: center; width: 60px; height: 60px; margin-bottom: 20px;
        border-radius: 18px; background: var(--startup-tile); color: var(--startup-accent);
      }
      #startup-shell p { margin: 0; }
      .startup-dots { display: flex; gap: 5px; margin-top: 18px; height: 6px; }
      .startup-dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--startup-accent); animation: startup-pulse 1.4s ease-in-out infinite; }
      .startup-dots i:nth-child(2) { animation-delay: .16s; }
      .startup-dots i:nth-child(3) { animation-delay: .32s; }
      #startup-recovery {
        position: absolute; top: calc(50% + 90px); left: 24px; right: 24px;
        visibility: hidden; animation: startup-recovery 0s 15s forwards;
        font-size: 12px; color: var(--startup-muted);
      }
      #startup-shell a {
        display: inline-block; margin-top: 12px; padding: 5px 16px; border-radius: 8px;
        color: var(--color-text, var(--startup-ink)); background: var(--startup-tile); text-decoration: none;
      }
      #startup-shell a:hover { filter: brightness(.96); }
      #startup-shell a:focus-visible { outline: 2px solid var(--startup-accent); outline-offset: 3px; }
      #startup-shell[data-state] #startup-recovery { animation: none; visibility: visible; }
      #startup-shell[data-state="failed"] .startup-dots { visibility: hidden; }
      .startup-brand { position: absolute; bottom: 24px; font-size: 11px; letter-spacing: .08em; color: var(--startup-muted); }
      @keyframes startup-pulse { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
      @keyframes startup-recovery { to { visibility: visible; } }
      @media (prefers-color-scheme: dark) {
        #startup-shell { --startup-bg: #1e1e1e; --startup-ink: #e6e8eb; --startup-muted: #999ca5; --startup-accent: #aaaade; --startup-tile: #2b2b35; }
      }
      @media (prefers-reduced-motion: reduce) { .startup-dots i { animation: none; opacity: .6; } }
    </style>
  </head>
  <body>
    <section id="startup-shell" aria-label="FloatNote 启动">
      <div class="startup-mark" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 5h10l5 5v15a2 2 0 0 1-2 2H10a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z"/>
          <path d="M20 5v6h5M12 16h8M12 21h5"/>
        </svg>
      </div>
      <p id="startup-message" role="status">正在打开笔记…</p>
      <div class="startup-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <div id="startup-recovery">
        <p>你可以重新加载后再试一次</p>
        <a href="index.html">重新加载</a>
      </div>
      <span class="startup-brand" aria-hidden="true">FloatNote</span>
    </section>
    <div id="app" inert></div>
    <script type="module" src="/src/note/main.ts"></script>
  </body>
</html>
